<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microstock AI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-indigo-400">Microstock AI Studio & Metadata Generator</h1>
      <p class="text-xs text-slate-400 mt-1">Langkah 1: Generate Gambar HD & Buat File Metadata CSV</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Form Input -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-semibold">Gemini API Key (Opsional - Gratis):</label>
          <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs">
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1 font-semibold">Prompt Ide Gambar:</label>
          <textarea id="prompt" rows="3" placeholder="Contoh: Professional Asian entrepreneur working in modern office, stock photo..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs"></textarea>
        </div>

        <button onclick="runGenerator()" id="btnRun" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded text-xs transition">
          1. Generate Gambar HD & Metadata
        </button>
      </div>

      <!-- Preview & Metadata Result -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4 flex flex-col justify-between">
        <div>
          <h2 class="text-xs font-semibold text-slate-400 uppercase mb-2">Preview Hasil</h2>
          <div class="bg-slate-950 h-48 rounded border border-slate-800 flex items-center justify-center overflow-hidden">
            <img id="previewImg" class="max-h-full hidden">
            <span id="imgStatus" class="text-xs text-slate-600">Gambar belum dibuat</span>
          </div>
        </div>

        <div class="space-y-2">
          <button onclick="downloadJPG()" id="btnDlJpg" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded text-xs disabled:opacity-40">
            2. Download Gambar (HD JPG)
          </button>
          <button onclick="downloadCSV()" id="btnDlCsv" disabled class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 rounded text-xs disabled:opacity-40">
            3. Download File Metadata (CSV)
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentBlob = null;
    let metadata = { title: '', desc: '', keywords: '' };

    async function runGenerator() {
      const p = document.getElementById('prompt').value;
      if(!p) return alert("Isi prompt terlebih dahulu!");

      document.getElementById('imgStatus').innerText = "Sedang merender gambar HD...";
      document.getElementById('previewImg').classList.add('hidden');

      // Request High-Res Upscaled Dimensions (2560x1440)
      const fullPrompt = encodeURIComponent(`${p}, commercial stock photo, ultra detailed, 8k resolution, high quality`);
      const imgUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=2560&height=1440&nologo=true`;

      try {
        const res = await fetch(imgUrl);
        currentBlob = await res.blob();
        
        const img = document.getElementById('previewImg');
        img.src = URL.createObjectURL(currentBlob);
        img.classList.remove('hidden');
        document.getElementById('imgStatus').classList.add('hidden');

        // Setup Metadata
        metadata.title = p.substring(0, 50);
        metadata.desc = `High quality stock photo illustration of ${p}. Professional commercial concept.`;
        metadata.keywords = `${p.replaceAll(" ", ",")},stock,photo,business,concept,background,isolated,modern,illustration,creative,design,high,quality`;

        document.getElementById('btnDlJpg').disabled = false;
        document.getElementById('btnDlCsv').disabled = false;
      } catch(e) {
        alert("Gagal merender gambar. Coba lagi.");
      }
    }

    function downloadJPG() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(currentBlob);
      a.download = "image_microstock.jpg";
      a.click();
    }

    function downloadCSV() {
      const csv = `Filename,Title,Description,Keywords\n"image_microstock.jpg","${metadata.title}","${metadata.desc}","${metadata.keywords}"`;
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "metadata.csv";
      a.click();
    }
  </script>
</body>
</html>
